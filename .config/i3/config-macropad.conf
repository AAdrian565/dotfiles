bindsym KP_End exec --no-startup-id sh -c 'pactl set-source-mute "$(pactl get-default-source)" toggle && pkill -RTMIN+10 i3blocks'


bindsym $mod+Shift+c exec gcolor3
for_window [class="^Color picker$"] floating enable
for_window [class="^Friends List$"] floating enable
for_window [class="^Zoom Workspace$"] floating enable
for_window [class="^zoom"] floating enable

# Use Mouse+$mod to drag floating windows to their wanted position
for_window [class="^Big Meter (GUI)$"] floating enable move position center
floating_modifier $mod

for_window [class="Shutter"] floating enable move position center
for_window [title="Sign In - Google Accounts —"] floating enable move position center

exec --no-startup-id pasystray
exec --no-startup-id pavucontrol
for_window [title="^Volume Control$"] mark --add volume-control, floating enable, move scratchpad
bindcode 106 [con_mark="volume-control"] scratchpad show, resize set 1000 1000, move position center

exec --no-startup-id blueman-manager
for_window [title="^Bluetooth Devices$"] mark --add bluetooth-devices, floating enable, move scratchpad
bindcode 63 [con_mark="bluetooth-devices"] scratchpad show, resize set 400 600, move position center

exec --no-startup-id firefoxpwa site launch 01KVMFJD3W285G4G92B1A0AG4K
for_window [title="Telegram — Mozilla Firefox$"] mark --add telegram, floating enable, move scratchpad
bindsym KP_Begin [con_mark="telegram"] scratchpad show, resize set 1000 800, fullscreen disable, move position center

exec --no-startup-id firefoxpwa site launch 01JA4AP6DGVF2DXK0MN66VKG7P
for_window [title="YouTube Music — Mozilla Firefox"] mark --add youtube-music, floating enable, move scratchpad
bindcode 82 [con_mark="youtube-music"] scratchpad show, resize set 400 600, move position center

