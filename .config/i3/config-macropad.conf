# bindsym Mod2+KP_1 exec --no-startup-id pactl set-source-mute "$(pactl get-default-source)" toggle && $refresh_i3status
bindsym Mod2+KP_1 exec --no-startup-id sh -c 'pactl set-source-mute "$(pactl get-default-source)" toggle && pkill -RTMIN+10 i3blocks'


bindsym $mod+Shift+c exec gcolor3
for_window [class="^Color picker$"] floating enable
for_window [class="^Friends List$"] floating enable
for_window [class="^Zoom Workspace$"] floating enable
for_window [class="^zoom"] floating enable

# Use Mouse+$mod to drag floating windows to their wanted position
for_window [class="^Big Meter (GUI)$"] floating enable move position center
floating_modifier $mod

for_window [class="Shutter"] floating enable move position center
for_window [title="Sign In - Google Accounts —"] floating enable move position center

exec --no-startup-id pasystray
exec --no-startup-id pavucontrol
for_window [title="^Volume Control$"] mark --add volume-control, floating enable, move scratchpad
bindsym Mod2+KP_Divide [con_mark="volume-control"] scratchpad show, resize set 1000 1000, move position center

exec --no-startup-id blueman-manager
for_window [title="^Bluetooth Devices$"] mark --add bluetooth-devices, floating enable, move scratchpad
bindsym Mod2+KP_Multiply [con_mark="bluetooth-devices"] scratchpad show, resize set 400 600, move position center

exec --no-startup-id firefoxpwa site launch 01KVMFJD3W285G4G92B1A0AG4K
# A PWA title changes to the active chat name.  Mark the window while it has
# its initial title, then use that persistent mark for the macropad binding.
for_window [title="Telegram — Mozilla Firefox$"] mark --add telegram, floating enable, move scratchpad
bindsym Mod2+KP_5 [con_mark="telegram"] scratchpad show, resize set 400 600, fullscreen disable, move position center

exec --no-startup-id firefoxpwa site launch 01JA4AP6DGVF2DXK0MN66VKG7P
for_window [title="YouTube Music — Mozilla Firefox"] mark --add youtube-music, floating enable, move scratchpad
bindsym Mod2+KP_Subtract [con_mark="youtube-music"] scratchpad show, resize set 400 600, move position center

bindsym Mod2+KP_7 exec --no-startup-id playerctl previous
bindsym Mod2+KP_8 exec --no-startup-id playerctl play-pause
bindsym Mod2+KP_9 exec --no-startup-id playerctl next

exec --no-startup-id discord
for_window [title=" - Discord$"] mark --add discord, floating enable, move scratchpad
bindsym Mod2+KP_4 [con_mark="discord"] scratchpad show, resize set 1400 1000, move position center

# for_window [title="^.*Discord \|.*$"] floating enable move scratchpad
# bindsym Mod2+KP_4 [title="^.*Discord \|.*$"] scratchpad show resize set 1400 1000; move position center


# bindsym Mod2+KP_5 [title="^feh"] scratchpad show resize set 800 800; move position center

exec --no-startup-id firefoxpwa site launch 01JA4JS3M3PANQFRSNH2NFCXR7
for_window [title="^Whatsapp Webapp$"] mark --add whatsapp, floating enable, move scratchpad
bindsym Mod2+KP_6 [con_mark="whatsapp"] scratchpad show, resize set 1000 800, move position center

# Audio-output shortcuts.  Besides changing the default sink, move currently
# playing streams so the change is audible immediately.
bindsym Mod2+KP_2 exec --no-startup-id sh -c 'pactl set-default-sink alsa_output.usb-Synaptics_CX31993_384Khz_HIFI_AUDIO-00.analog-stereo && pactl list short sink-inputs | cut -f1 | xargs -r -n1 pactl move-sink-input alsa_output.usb-Synaptics_CX31993_384Khz_HIFI_AUDIO-00.analog-stereo && pkill -RTMIN+11 i3blocks'
bindsym Mod2+KP_3 exec --no-startup-id sh -c 'pactl set-default-sink alsa_output.pci-0000_01_00.1.hdmi-stereo && pactl list short sink-inputs | cut -f1 | xargs -r -n1 pactl move-sink-input alsa_output.pci-0000_01_00.1.hdmi-stereo && pkill -RTMIN+11 i3blocks'

# for_window [title="Picture-in-Picture"] floating enable resize set 427 240; move position 1450 800
for_window [title="Picture-in-Picture"] mark --add picture-in-picture, floating enable, sticky enable, move scratchpad

for_window [title="^JACK Audio Connection Kit"] floating enable move position center
for_window [title="QjackCtl$"] floating enable move position center
