# Picom configuration for i3 (X11).
# Reload it after edits with: pkill -x picom; picom --config ~/.config/picom/picom.conf &

backend = "glx";
vsync = true;
use-damage = true;

# Smooth, restrained window transitions.
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 1;

# Shadows make floating windows and menus easier to distinguish.
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.55;
shadow-offset-x = -10;
shadow-offset-y = -10;
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'Cairo-clock'",
  "_GTK_FRAME_EXTENTS@:c"
];

# Keep regular windows opaque; applications can still set their own opacity.
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-dim = 0.0;

# Subtle rounded corners.  Docks and the desktop stay square.
corner-radius = 6;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

# Blur only translucent windows.  dual_kawase is fast and works well with GLX.
blur-method = "dual_kawase";
blur-strength = 5;
blur-background = true;
blur-background-frame = true;
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "window_type = 'menu'",
  "window_type = 'dropdown_menu'",
  "window_type = 'popup_menu'",
  "window_type = 'tooltip'",
  "class_g = 'slop'",
  "name = 'slop'",
  "_GTK_FRAME_EXTENTS@:c"
];

mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-client-opacity = true;
detect-transient = true;

# Prevent shadows from interfering with panels, menus, and drag-and-drop.
wintypes:
{
  dock = { shadow = false; clip-shadow-above = true; };
  dnd = { shadow = false; };
  tooltip = { fade = true; shadow = true; opacity = 0.9; focus = true; };
};
